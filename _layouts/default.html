<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
    <div class="wrapper">
        <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title | default: "The Best News Ever" }}</a>
        <button class="menu-toggle" onclick="this.parentNode.parentNode.classList.toggle('active')">☰</button>
        <nav class="site-nav">
            <a href="#top" onclick="this.parentNode.parentNode.parentNode.classList.remove('active')">Gospel</a>
            <a href="#why-this-matters" onclick="this.parentNode.parentNode.parentNode.classList.remove('active')">Why this matters</a>
            <a href="#why-we-need-a-saviour" onclick="this.parentNode.parentNode.parentNode.classList.remove('active')">Need a Saviour</a>
            <a href="#gods-plan-for-salvation-jesus-christ" onclick="this.parentNode.parentNode.parentNode.classList.remove('active')">Salvation</a>
            <a href="#how-to-receive-eternal-life-believe-in-christ-alone" onclick="this.parentNode.parentNode.parentNode.classList.remove('active')">Believe</a>
            <a href="#gods-promise-and-your-assurance" onclick="this.parentNode.parentNode.parentNode.classList.remove('active')">Assurance</a>
            <a href="#what-about-you" onclick="this.parentNode.parentNode.parentNode.classList.remove('active')">What about you</a>
            <a href="#whats-next" onclick="this.parentNode.parentNode.parentNode.classList.remove('active')">Next Steps</a>
        </nav>
    </div>
</header>

<main>
    <div class="wrapper">
        {{ content }}
    </div>
</main>

{% include footer.html %}

</body>
</html>
