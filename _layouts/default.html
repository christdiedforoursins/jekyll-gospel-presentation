<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
    <div class="wrapper">
        <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title | default: "The Best News Ever" }}</a>
        <nav class="site-nav">
            <a href="#why-this-matters">Intro</a>
            <a href="#why-we-need-a-saviour">The Problem</a>
            <a href="#gods-plan-for-salvation-jesus-christ">The Solution</a>
            <a href="#how-to-receive-eternal-life-believe-in-christ-alone">Response</a>
        </nav>
        <button class="menu-toggle" aria-label="Toggle navigation">&#9776;</button>
    </div>
</header>

<main>
    <div class="wrapper">
        {{ content }}
    </div>
</main>

{% include footer.html %}

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const menuToggle = document.querySelector('.menu-toggle');
        const siteHeader = document.querySelector('.site-header');

        if (menuToggle) {
            menuToggle.addEventListener('click', function() {
                siteHeader.classList.toggle('active');
            });
        }
    });
</script>
</body>
</html>
